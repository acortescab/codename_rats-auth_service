services:
  db:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      ENV: dev
      DATABASE_URL_READER: postgresql://user:pass@db:5432/db
      DATABASE_URL_WRITER: postgresql://user:pass@db:5432/db
      SECRET_KEY: DeyLu5K0xn_MX-9HSCxHrn0lZ9ZDjk4b_Kw9U6cAUWJeaStr8NaJQnyB2JI-Yi-0oFd9ujlTgt0D35tTuCfPIw
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000