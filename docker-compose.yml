services:
  db:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      ENV: ${ENV}
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL_READER: ${DATABASE_URL_READER}
      DATABASE_URL_WRITER: ${DATABASE_URL_WRITER}
    depends_on:
      db:
        condition: service_healthy